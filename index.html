<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blog Bersama</title>
  
  <style>
    :root {
      --warna-utama: #2c3e50;
      --warna-aksen: #e74c3c;
      --warna-latar: #f8f9fa;
      --warna-kartu: #ffffff;
      --font: 'Segoe UI', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: var(--font); background: var(--warna-latar); color: #333; line-height: 1.7; }
    .container { max-width: 900px; margin: 0 auto; padding: 20px; }

    header {
      background: var(--warna-utama);
      color: white;
      padding: 1.5rem 0;
      text-align: center;
      border-radius: 0 0 12px 12px;
      margin-bottom: 30px;
    }

    h1 { font-size: 2em; }
    h2 { color: var(--warna-utama); margin: 20px 0 10px; }

    .btn {
      padding: 10px 18px; border: none; border-radius: 6px; cursor: pointer;
      font-size: 14px; transition: 0.3s; text-decoration: none; display: inline-block; margin: 5px;
    }
    .btn-primary { background: var(--warna-utama); color: white; }
    .btn-danger { background: var(--warna-aksen); color: white; }
    .btn-small { padding: 6px 12px; font-size: 13px; }
    .btn:hover { opacity: 0.9; transform: translateY(-1px); }

    .card {
      background: var(--warna-kartu); padding: 20px; border-radius: 10px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.1); margin-bottom: 20px;
    }

    .post-meta { font-size: 0.9em; color: #777; margin-bottom: 10px; }

    input, textarea, select {
      width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd;
      border-radius: 6px; font-family: inherit;
    }

    .media-preview {
      margin: 15px 0; padding: 10px; border: 1px dashed #ccc; border-radius: 8px;
      text-align: center; background: #f9f9f9;
    }
    .media-preview img, .media-preview video {
      max-width: 100%; max-height: 300px; border-radius: 8px; margin: 10px 0;
    }
    .media-preview .remove-media {
      background: #e74c3c; color: white; border: none; padding: 5px 10px;
      border-radius: 4px; cursor: pointer; font-size: 12px;
    }

    .hidden { display: none !important; }
    .login-box { max-width: 400px; margin: 50px auto; text-align: center; }
    .loading { color: #777; font-style: italic; text-align: center; }

    .dashboard-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }

    @media (max-width: 600px) {
      .dashboard-header { flex-direction: column; text-align: center; }
      .btn { width: 100%; margin: 8px 0; }
    }
  </style>
</head>
<body>

  <!-- === BLOG PUBLIK === -->
  <div id="blog-page" class="container">
    <header>
      <h1 id="blog-title">Blog Bersama</h1>
      <p id="blog-subtitle">Semua orang bisa lihat postinganmu!</p>
    </header>

    <div id="posts-container">
      <p class="loading">Memuat postingan...</p>
    </div>

    <div style="text-align: center; margin: 40px 0;">
      <button class="btn btn-primary" onclick="showAdmin()">Login Admin</button>
    </div>
  </div>

  <!-- === LOGIN ADMIN === -->
  <div id="login-page" class="hidden">
    <div class="login-box card">
      <h2>Login Admin</h2>
      <input type="text" id="username" placeholder="Username" value="admin" />
      <input type="password" id="password" placeholder="Password" value="1234" />
      <button class="btn btn-primary" onclick="login()">Masuk</button>
      <button class="btn" onclick="showBlog()" style="background:#95a5a6; color:white;">Kembali</button>
      <p id="login-error" style="color:red; margin-top:10px;"></p>
    </div>
  </div>

  <!-- === DASHBOARD ADMIN === -->
  <div id="admin-page" class="hidden container">
    <header>
      <h1>Dashboard Admin</h1>
    </header>

    <div class="dashboard-header">
      <h2>Daftar Postingan</h2>
      <div>
        <button class="btn btn-primary" onclick="showAddForm()">+ Tambah</button>
        <button class="btn" onclick="logout()" style="background:#95a5a6; color:white;">Logout</button>
      </div>
    </div>

    <!-- Form -->
    <div id="post-form" class="card hidden">
      <h3 id="form-title">Tambah Postingan</h3>
      <input type="hidden" id="edit-id" />

      <input type="text" id="post-title" placeholder="Judul" required />
      <textarea id="post-content" rows="5" placeholder="Isi..."></textarea>
      <input type="text" id="post-author" placeholder="Penulis" />

      <div style="margin: 15px 0;">
        <label><strong>Gambar/Video (maks 1.5MB)</strong></label>
        <input type="file" id="media-upload" accept="image/*,video/*" />
      </div>

      <div id="media-preview" class="media-preview hidden">
        <p><strong>Pratinjau:</strong></p>
        <div id="preview-content"></div>
        <button class="remove-media" onclick="removeMedia()">Hapus</button>
      </div>

      <div style="text-align:right; margin-top:15px;">
        <button class="btn btn-primary" onclick="savePost()">Simpan</button>
        <button class="btn" onclick="hideForm()">Batal</button>
      </div>
    </div>

    <div id="admin-posts">
      <p class="loading">Memuat...</p>
    </div>
  </div>

  <!-- === JAVASCRIPT (SUDAH DIPERBAIKI!) === -->
  <script>
    // === UBAH INI SESUAI GITHUB KAMU ===
    const GITHUB_CONFIG = {
      owner: 'andrivabahb', // Contoh: 'johndoe'
    repo: 'nayri_blog', // Nama repo
    token: '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', // Paste Personal Access Token di sini
    filePath: 'posts.json'
    };

    let posts = [];
    let currentMedia = null;
    let currentMediaType = null;

  // TAMBAHKAN INI: NETLIFY WEBHOOK URL
  const NETLIFY_WEBHOOK = 'https://api.netlify.com/build_hooks/691ad3ef114926e83c69202f';

  let posts = [];
  let currentMedia = null;
  let currentMediaType = null;

  // === GITHUB API (tetap) ===
  async function fetchPosts() {
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`);
      if (!res.ok) throw new Error('File tidak ditemukan');
      const data = await res.json();
      posts = JSON.parse(atob(data.content));
      renderPosts();
      if (!document.getElementById('admin-page').classList.contains('hidden')) renderAdminPosts();
    } catch (err) {
      document.getElementById('posts-container').innerHTML = '<p style="color:red;">Gagal load: Pastikan repo & token benar.</p>';
    }
  }

  async function savePostsToGitHub() {
    const content = btoa(JSON.stringify(posts, null, 2));
    try {
      const res = await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`, { method: 'GET' });
      const data = await res.json();
      const sha = data.sha;

      await fetch(`https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/contents/${GITHUB_CONFIG.filePath}`, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${GITHUB_CONFIG.token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update posts',
          content: content,
          sha: sha
        })
      });
    } catch (err) {
      throw new Error('Gagal simpan ke GitHub');
    }
  }

  // === TRIGGER NETLIFY REBUILD ===
  async function triggerNetlifyRebuild() {
    try {
      await fetch(NETLIFY_WEBHOOK, { method: 'POST' });
    } catch (err) {
      console.warn('Webhook gagal, tapi data tetap tersimpan di GitHub');
    }
  }

  // === SIMPAN POST (DIPERBAIKI!) ===
  async function savePost() {
    const id = document.getElementById('edit-id').value;
    const title = document.getElementById('post-title').value.trim();
    const content = document.getElementById('post-content').value.trim();
    const author = document.getElementById('post-author').value.trim() || 'Admin';

    if (!title) return alert('Judul wajib!');

    const postData = {
      id: id ? parseInt(id) : Date.now(),
      title, content, author,
      date: new Date().toLocaleDateString('id-ID'),
      media: currentMedia,
      mediaType: currentMediaType
    };

    if (id) {
      const idx = posts.findIndex(p => p.id == id);
      posts[idx] = postData;
    } else {
      posts.unshift(postData);
    }

    try {
      await savePostsToGitHub();
      await triggerNetlifyRebuild(); // <--- INI YANG BARU!
      hideForm();
      renderAdminPosts();
      renderPosts();
      alert('Postingan tersimpan! Netlify sedang rebuild... Tunggu 30-60 detik, lalu refresh.');
    } catch (err) {
      alert('Gagal simpan! Cek token GitHub & webhook Netlify.');
    }
  }

  // === FUNGSI LAIN TETAP SAMA ===
  function showBlog() { hideAll(); document.getElementById('blog-page').classList.remove('hidden'); fetchPosts(); }
  function showAdmin() { hideAll(); document.getElementById('login-page').classList.remove('hidden'); }
  function showDashboard() { hideAll(); document.getElementById('admin-page').classList.remove('hidden'); fetchPosts(); }
  function hideAll() { ['blog-page', 'login-page', 'admin-page'].forEach(id => document.getElementById(id).classList.add('hidden')); }

  function login() {
    if (document.getElementById('username').value === 'admin' && document.getElementById('password').value === '1234') {
      showDashboard();
    } else {
      document.getElementById('login-error').textContent = 'Salah!';
    }
  }
  function logout() { showBlog(); }

  function renderPosts() {
    const container = document.getElementById('posts-container');
    container.innerHTML = '';
    if (!posts.length) {
      container.innerHTML = '<p style="text-align:center; color:#777;">Belum ada postingan.</p>';
      return;
    }
    posts.forEach(post => {
      const div = document.createElement('div');
      div.className = 'card';
      let media = '';
      if (post.media) {
        media = post.mediaType.startsWith('image')
          ? `<img src="${post.media}" style="max-width:100%; border-radius:8px; margin:15px 0;">`
          : `<video controls style="max-width:100%; border-radius:8px; margin:15px 0;"><source src="${post.media}" type="${post.mediaType}"></video>`;
      }
      div.innerHTML = `
        <h2>${escapeHtml(post.title)}</h2>
        <div class="post-meta">Oleh ${escapeHtml(post.author)} • ${post.date}</div>
        ${media}
        <p>${escapeHtml(post.content).replace(/\n/g, '<br>')}</p>
      `;
      container.appendChild(div);
    });
  }

  function renderAdminPosts() {
    const container = document.getElementById('admin-posts');
    container.innerHTML = '';
    if (!posts.length) { container.innerHTML = '<p>Tidak ada postingan.</p>'; return; }
    posts.forEach(post => {
      const div = document.createElement('div');
      div.className = 'card';
      div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;';
      div.innerHTML = `
        <div style="flex:1;">
          <strong>${escapeHtml(post.title)}</strong><br>
          <small>${post.date} • ${escapeHtml(post.author)}</small>
        </div>
        <div>
          <button class="btn btn-primary btn-small" onclick="editPost(${post.id})">Edit</button>
          <button class="btn btn-danger btn-small" onclick="deletePost(${post.id})">Hapus</button>
        </div>
      `;
      container.appendChild(div);
    });
  }

  // === FORM, MEDIA, HAPUS (tetap sama) ===
  function showAddForm() { resetForm(); document.getElementById('form-title').textContent = 'Tambah Postingan'; document.getElementById('post-form').classList.remove('hidden'); }
  function editPost(id) { /* ... sama seperti sebelumnya ... */ }
  function hideForm() { document.getElementById('post-form').classList.add('hidden'); resetForm(); }
  function resetForm() { /* ... */ }
  document.getElementById('media-upload').addEventListener('change', /* ... */);
  function showMediaPreview() { /* ... */ }
  function removeMedia() { /* ... */ }

  async function deletePost(id) {
    if (!confirm('Hapus?')) return;
    posts = posts.filter(p => p.id !== id);
    await savePostsToGitHub();
    await triggerNetlifyRebuild();
    renderAdminPosts();
    renderPosts();
  }

  function escapeHtml(text) { const div = document.createElement('div'); div.textContent = text; return div.innerHTML; }

  // === INIT ===
  showBlog();
</script>
</body>
</html>
